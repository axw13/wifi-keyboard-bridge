name: Windows client build
on:
  push:
    branches: [main, feature/v2-reliability-diagnostics]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build windows-client/KeyboardBridge/KeyboardBridge.csproj -c Release
      - name: Publish standalone Windows x64
        run: dotnet publish windows-client/KeyboardBridge/KeyboardBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o release
      - uses: actions/upload-artifact@v4
        with:
          name: keyboard-bridge-win-x64
          path: release/
